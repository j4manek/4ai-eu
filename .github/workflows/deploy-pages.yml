name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The contact form's API route needs a real server (POST handlers
      # aren't supported by `next export`) — this preview build drops it.
      - run: rm -rf app/api

      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_GITHUB_PAGES: "true"
          # Set a "Repository variable" named CONTACT_FORM_EMAIL (Settings → Secrets
          # and variables → Actions → Variables) to the inbox that should receive
          # contact-form submissions. FormSubmit.co sends a one-time confirmation
          # link to that address the first time it's used — click it once to
          # activate delivery. Without this variable the form has no working
          # backend on GitHub Pages and submissions will fail.
          NEXT_PUBLIC_CONTACT_FORM_EMAIL: ${{ vars.CONTACT_FORM_EMAIL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
